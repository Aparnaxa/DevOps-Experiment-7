
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Docker Application</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #eef2ff;
            padding: 80px 20px;
            margin: 0;
        }

        .container {
            background: white;
            max-width: 600px;
            margin: auto;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            color: #2563eb;
        }

        p {
            color: #475569;
            line-height: 1.7;
        }

        .status {
            display: inline-block;
            background: #dcfce7;
            color: #15803d;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Welcome to My Docker Application!</h1>

        <p>
            This application is running inside
            a custom Docker container.
        </p>

        <p class="status">Docker Container Running Successfully</p>

        <p><strong>DevOps Lab - Experiment 5</strong></p>
        <p>Created by Aparna</p>
    </div>
</body>
</html>
